<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Todo List - Vue</title>
    <script src="https://unpkg.com/vue@3/dist/vue.global.js"></script>
    <script src="https://unpkg.com/vue-router@4/dist/vue-router.global.js"></script>
    <script src="https://unpkg.com/axios/dist/axios.min.js"></script>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            line-height: 1.6;
            color: #333;
            background-color: #f8f9fa;
        }
        
        #app {
            max-width: 800px;
            margin: 0 auto;
            padding: 20px;
        }
        
        .auth-container {
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 80vh;
        }
        
        .auth-form {
            background: white;
            padding: 40px;
            border-radius: 10px;
            box-shadow: 0 4px 6px rgba(0, 0, 0, 0.1);
            width: 100%;
            max-width: 400px;
        }
        
        .form-group {
            margin-bottom: 20px;
        }
        
        label {
            display: block;
            margin-bottom: 5px;
            color: #555;
            font-weight: 500;
        }
        
        input {
            width: 100%;
            padding: 12px;
            border: 2px solid #ddd;
            border-radius: 6px;
            font-size: 16px;
            transition: border-color 0.3s ease;
            box-sizing: border-box;
        }
        
        input:focus {
            outline: none;
            border-color: #007bff;
        }
        
        button {
            width: 100%;
            padding: 12px;
            background-color: #007bff;
            color: white;
            border: none;
            border-radius: 6px;
            font-size: 16px;
            cursor: pointer;
            transition: background-color 0.3s ease;
            margin-top: 10px;
        }
        
        button:hover:not(:disabled) {
            background-color: #0056b3;
        }
        
        button:disabled {
            background-color: #6c757d;
            cursor: not-allowed;
        }
        
        .alert {
            padding: 12px;
            border-radius: 6px;
            margin-top: 20px;
            text-align: center;
            font-weight: 500;
        }
        
        .alert-error {
            background-color: #f8d7da;
            color: #721c24;
            border: 1px solid #f5c6cb;
        }
        
        .alert-success {
            background-color: #d4edda;
            color: #155724;
            border: 1px solid #c3e6cb;
        }
        
        .home {
            max-width: 600px;
            margin: 0 auto;
            padding: 20px;
        }
        
        .user-controls {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 30px;
            padding: 10px 0;
            border-bottom: 1px solid #eee;
        }
        
        .logout-btn {
            background-color: #dc3545;
            color: white;
            border: none;
            padding: 8px 16px;
            border-radius: 4px;
            cursor: pointer;
            font-size: 14px;
            width: auto;
        }
        
        .logout-btn:hover {
            background-color: #c82333;
        }
        
        .todo-form {
            display: flex;
            gap: 10px;
            margin-bottom: 30px;
        }
        
        .todo-input {
            flex: 1;
            padding: 12px;
            border: 2px solid #ddd;
            border-radius: 6px;
            font-size: 16px;
        }
        
        .add-btn {
            background-color: #007bff;
            color: white;
            border: none;
            padding: 12px 24px;
            border-radius: 6px;
            cursor: pointer;
            font-size: 16px;
            width: auto;
        }
        
        .todo-list {
            display: flex;
            flex-direction: column;
            gap: 10px;
        }
        
        .todo-item {
            display: flex;
            align-items: center;
            gap: 12px;
            padding: 15px;
            background-color: #f8f9fa;
            border-radius: 8px;
            border: 1px solid #e9ecef;
        }
        
        .todo-item.completed {
            opacity: 0.7;
            background-color: #d4edda;
        }
        
        .todo-text {
            flex: 1;
            text-align: left;
        }
        
        .todo-item.completed .todo-text {
            text-decoration: line-through;
            color: #6c757d;
        }
        
        .delete-btn {
            background-color: #dc3545;
            color: white;
            border: none;
            padding: 6px 12px;
            border-radius: 4px;
            cursor: pointer;
            font-size: 12px;
            width: auto;
        }
        
        .nav-links {
            text-align: center;
            margin-top: 20px;
        }
        
        .nav-links a {
            color: #007bff;
            text-decoration: none;
            margin: 0 10px;
        }
        
        .nav-links a:hover {
            text-decoration: underline;
        }
    </style>
</head>
<body>
    <div id="app">
        <router-view></router-view>
    </div>

    <script>
        const { createApp } = Vue;
        const { createRouter, createWebHistory } = VueRouter;

        // 认证服务
        const AuthService = {
            login: async (username, password) => {
                const response = await axios.post('http://localhost:8000/api/login', {
                    username,
                    password
                }, {
                    headers: {
                        'Content-Type': 'application/x-www-form-urlencoded'
                    },
                    transformRequest: [(data) => {
                        const formData = new URLSearchParams();
                        for (const key in data) {
                            formData.append(key, data[key]);
                        }
                        return formData.toString();
                    }]
                });
                if (response.data.access_token) {
                    localStorage.setItem('user', JSON.stringify(response.data));
                }
                return response.data;
            },

            logout: () => {
                localStorage.removeItem('user');
            },

            register: async (username, email, password) => {
                return await axios.post('http://localhost:8000/api/register', {
                    username,
                    email,
                    password
                });
            },

            getCurrentUser: () => {
                const userStr = localStorage.getItem('user');
                if (userStr) {
                    return JSON.parse(userStr);
                }
                return null;
            },

            authHeader: () => {
                const user = AuthService.getCurrentUser();
                if (user && user.access_token) {
                    return { Authorization: `Bearer ${user.access_token}` };
                } else {
                    return {};
                }
            }
        };

        // 登录组件
        const Login = {
            template: `
                <div class="auth-container">
                    <div class="auth-form">
                        <h2>登录</h2>
                        <form @submit.prevent="handleLogin">
                            <div class="form-group">
                                <label for="username">用户名:</label>
                                <input type="text" id="username" v-model="username" required :disabled="loading" />
                            </div>
                            <div class="form-group">
                                <label for="password">密码:</label>
                                <input type="password" id="password" v-model="password" required :disabled="loading" />
                            </div>
                            <button type="submit" :disabled="loading">{{ loading ? '登录中...' : '登录' }}</button>
                        </form>
                        <div v-if="message" :class="['alert', messageType === 'success' ? 'alert-success' : 'alert-error']">
                            {{ message }}
                        </div>
                        <div class="nav-links">
                            <router-link to="/register">还没有账户？立即注册</router-link>
                        </div>
                    </div>
                </div>
            `,
            data() {
                return {
                    username: '',
                    password: '',
                    loading: false,
                    message: '',
                    messageType: 'error'
                };
            },
            methods: {
                async handleLogin() {
                    if (!this.username || !this.password) {
                        this.showMessage('请填写所有字段', 'error');
                        return;
                    }
                    
                    this.loading = true;
                    this.message = '';
                    
                    try {
                        await AuthService.login(this.username, this.password);
                        this.showMessage('登录成功！', 'success');
                        
                        setTimeout(() => {
                            this.$router.push('/');
                        }, 1000);
                    } catch (error) {
                        console.error('登录失败:', error);
                        if (error.response?.status === 401) {
                            this.showMessage('用户名或密码错误', 'error');
                        } else {
                            this.showMessage('登录失败，请稍后重试', 'error');
                        }
                    } finally {
                        this.loading = false;
                    }
                },
                
                showMessage(text, type) {
                    this.message = text;
                    this.messageType = type;
                    
                    if (type === 'error') {
                        setTimeout(() => {
                            this.message = '';
                        }, 5000);
                    }
                }
            },
            
            mounted() {
                if (AuthService.getCurrentUser()) {
                    this.$router.push('/');
                }
            }
        };

        // 注册组件
        const Register = {
            template: `
                <div class="auth-container">
                    <div class="auth-form">
                        <h2>注册</h2>
                        <form @submit.prevent="handleRegister">
                            <div class="form-group">
                                <label for="username">用户名:</label>
                                <input type="text" id="username" v-model="username" required :disabled="loading" />
                            </div>
                            <div class="form-group">
                                <label for="email">邮箱:</label>
                                <input type="email" id="email" v-model="email" required :disabled="loading" />
                            </div>
                            <div class="form-group">
                                <label for="password">密码:</label>
                                <input type="password" id="password" v-model="password" required :disabled="loading" />
                            </div>
                            <div class="form-group">
                                <label for="confirmPassword">确认密码:</label>
                                <input type="password" id="confirmPassword" v-model="confirmPassword" required :disabled="loading" />
                            </div>
                            <button type="submit" :disabled="loading" style="background-color: #28a745;">{{ loading ? '注册中...' : '注册' }}</button>
                        </form>
                        <div v-if="message" :class="['alert', messageType === 'success' ? 'alert-success' : 'alert-error']">
                            {{ message }}
                        </div>
                        <div class="nav-links">
                            <router-link to="/login">已有账户？立即登录</router-link>
                        </div>
                    </div>
                </div>
            `,
            data() {
                return {
                    username: '',
                    email: '',
                    password: '',
                    confirmPassword: '',
                    loading: false,
                    message: '',
                    messageType: 'error'
                };
            },
            methods: {
                async handleRegister() {
                    if (!this.username || !this.email || !this.password || !this.confirmPassword) {
                        this.showMessage('请填写所有字段', 'error');
                        return;
                    }
                    
                    if (this.password !== this.confirmPassword) {
                        this.showMessage('密码和确认密码不匹配', 'error');
                        return;
                    }
                    
                    if (this.password.length < 6) {
                        this.showMessage('密码长度至少为6位', 'error');
                        return;
                    }
                    
                    this.loading = true;
                    this.message = '';
                    
                    try {
                        await AuthService.register(this.username, this.email, this.password);
                        this.showMessage('注册成功！请登录', 'success');
                        
                        setTimeout(() => {
                            this.$router.push('/login');
                        }, 2000);
                    } catch (error) {
                        console.error('注册失败:', error);
                        if (error.response?.status === 400) {
                            this.showMessage('用户名或邮箱已存在', 'error');
                        } else {
                            this.showMessage('注册失败，请稍后重试', 'error');
                        }
                    } finally {
                        this.loading = false;
                    }
                },
                
                showMessage(text, type) {
                    this.message = text;
                    this.messageType = type;
                    
                    if (type === 'error') {
                        setTimeout(() => {
                            this.message = '';
                        }, 5000);
                    }
                }
            },
            
            mounted() {
                if (AuthService.getCurrentUser()) {
                    this.$router.push('/');
                }
            }
        };

        // 首页组件
        const Home = {
            template: `
                <div class="home">
                    <div class="user-controls">
                        <span>欢迎, {{ currentUser?.username }}!</span>
                        <button @click="logout" class="logout-btn">退出登录</button>
                    </div>
                    
                    <h1>我的待办事项</h1>
                    
                    <div class="todo-form">
                        <input 
                            v-model="newTodo" 
                            @keyup.enter="addTodo" 
                            placeholder="添加新的待办事项..."
                            class="todo-input"
                        />
                        <button @click="addTodo" class="add-btn">添加</button>
                    </div>
                    
                    <div class="todo-list">
                        <div 
                            v-for="todo in todos" 
                            :key="todo.id" 
                            class="todo-item"
                            :class="{ completed: todo.completed }"
                        >
                            <input 
                                type="checkbox" 
                                :checked="todo.completed" 
                                @change="toggleTodo(todo.id)"
                            />
                            <span class="todo-text">{{ todo.text }}</span>
                            <button @click="deleteTodo(todo.id)" class="delete-btn">删除</button>
                        </div>
                    </div>
                    
                    <div v-if="todos.length === 0" style="text-align: center; color: #6c757d; font-style: italic; margin-top: 40px;">
                        <p>还没有待办事项，添加一个开始吧！</p>
                    </div>
                </div>
            `,
            data() {
                return {
                    todos: [],
                    newTodo: '',
                    currentUser: null
                };
            },
            mounted() {
                this.currentUser = AuthService.getCurrentUser();
                if (!this.currentUser) {
                    this.$router.push('/login');
                    return;
                }
                this.fetchTodos();
            },
            methods: {
                async fetchTodos() {
                    try {
                        const response = await axios.get('http://localhost:8000/api/todos', {
                            headers: AuthService.authHeader()
                        });
                        this.todos = response.data;
                    } catch (error) {
                        console.error('获取待办事项失败:', error);
                        if (error.response?.status === 401) {
                            AuthService.logout();
                            this.$router.push('/login');
                        }
                    }
                },
                
                async addTodo() {
                    if (!this.newTodo.trim()) return;
                    
                    try {
                        const response = await axios.post('http://localhost:8000/api/todos', {
                            text: this.newTodo
                        }, {
                            headers: AuthService.authHeader()
                        });
                        
                        this.todos.push(response.data);
                        this.newTodo = '';
                    } catch (error) {
                        console.error('添加待办事项失败:', error);
                        if (error.response?.status === 401) {
                            AuthService.logout();
                            this.$router.push('/login');
                        }
                    }
                },
                
                async toggleTodo(id) {
                    try {
                        const todo = this.todos.find(t => t.id === id);
                        const response = await axios.put(`http://localhost:8000/api/todos/${id}`, {
                            completed: !todo.completed
                        }, {
                            headers: AuthService.authHeader()
                        });
                        
                        const index = this.todos.findIndex(t => t.id === id);
                        this.todos[index] = response.data;
                    } catch (error) {
                        console.error('更新待办事项失败:', error);
                        if (error.response?.status === 401) {
                            AuthService.logout();
                            this.$router.push('/login');
                        }
                    }
                },
                
                async deleteTodo(id) {
                    try {
                        await axios.delete(`http://localhost:8000/api/todos/${id}`, {
                            headers: AuthService.authHeader()
                        });
                        this.todos = this.todos.filter(todo => todo.id !== id);
                    } catch (error) {
                        console.error('删除待办事项失败:', error);
                        if (error.response?.status === 401) {
                            AuthService.logout();
                            this.$router.push('/login');
                        }
                    }
                },
                
                logout() {
                    AuthService.logout();
                    this.$router.push('/login');
                }
            }
        };

        // 路由配置
        const routes = [
            { path: '/', component: Home },
            { path: '/login', component: Login },
            { path: '/register', component: Register }
        ];

        const router = createRouter({
            history: createWebHistory(),
            routes
        });

        // 路由守卫
        router.beforeEach((to, from, next) => {
            const isAuthenticated = AuthService.getCurrentUser();
            
            if (to.path === '/' && !isAuthenticated) {
                next('/login');
            } else if ((to.path === '/login' || to.path === '/register') && isAuthenticated) {
                next('/');
            } else {
                next();
            }
        });

        // 创建应用
        const app = createApp({});
        app.use(router);
        app.mount('#app');
    </script>
</body>
</html>
